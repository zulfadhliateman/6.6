<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuiz Unit 6.6 - Kesan Penglibatan dalam Sukan</title>
<style>
:root{--red:#b91c1c;--blue:#1d4ed8;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--bg:#f3f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);line-height:1.5}
header{background:linear-gradient(120deg,#991b1b,#1d4ed8);color:white;padding:28px 16px;text-align:center}header h1{margin:0;font-size:clamp(22px,4vw,32px)}header p{margin:7px 0 0}
main{max-width:900px;margin:22px auto;padding:0 14px}.panel,.question,.result{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0f172a0b}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}.bar{height:9px;background:#e5eaf2;border-radius:20px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--blue));width:0}
h2{font-size:19px;margin:12px 0}.option{display:block;border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}.option:hover{border-color:var(--blue);background:#eff6ff}.option input{margin-right:9px;accent-color:var(--blue)}.option.correct{border-color:#15803d;background:#f0fdf4}.option.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;padding:12px;border-radius:10px;margin-top:12px}.feedback.show{display:block}.good{background:#ecfdf5;color:#166534}.bad{background:#fef2f2;color:#991b1b}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:5px 5px 0 0;background:var(--blue);color:white}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#991b1b}.hidden{display:none}.score{font-size:42px;font-weight:800;color:var(--blue)}.small{color:var(--muted);font-size:13px}
.review-item{padding:12px 0;border-bottom:1px solid var(--line)}footer{text-align:center;color:var(--muted);padding:20px;font-size:13px}
</style></head><body><header><h1>Kuiz Interaktif Sains Sukan Tingkatan 5</h1><p>Unit 6.6: Kesan Penglibatan dalam Sukan</p></header>
<main><section class="panel"><div class="meta"><span id="counter">Soalan 1 daripada 30</span><span id="progressText">0% selesai</span></div><div class="bar"><span id="progress"></span></div><p class="small">Pilih satu jawapan yang paling tepat. Maklum balas dan penerangan diberikan selepas setiap jawapan.</p></section>
<div id="quiz"></div><section id="result" class="result hidden"></section></main>
<footer>Disediakan oleh : Cikgu Zulfadhli bin Ateman</footer>
<script>
const questions = [{"q": "Antara berikut, yang manakah merupakan kesan penglibatan dalam sukan terhadap individu?", "o": ["Meningkatkan tahap kesihatan keseluruhan", "Meningkatkan kemasukan pelancong asing", "Mengukuhkan hubungan diplomatik negara", "Meningkatkan hasil industri perhotelan"], "a": 0, "e": "Penglibatan dalam sukan dapat meningkatkan tahap kesihatan individu secara keseluruhan."}, {"q": "Apakah kesan penglibatan dalam sukan terhadap pembentukan diri seseorang?", "o": ["Membentuk sahsiah dan kesedaran diri", "Meningkatkan pendapatan negara secara langsung", "Menambah jumlah pelancong antarabangsa", "Mengurangkan peluang interaksi sosial"], "a": 0, "e": "Aktiviti sukan membantu membentuk sahsiah dan kesedaran diri individu."}, {"q": "Pernyataan manakah menunjukkan kesan sukan terhadap komuniti?", "o": ["Mengukuhkan integrasi nasional dalam kalangan rakyat", "Meningkatkan kecergasan seorang atlet sahaja", "Meningkatkan pendapatan peribadi atlet", "Mendapatkan tajaan individu"], "a": 0, "e": "Penglibatan sukan dalam komuniti dapat mengukuhkan integrasi nasional."}, {"q": "Apakah kesan kejayaan atlet negara di peringkat antarabangsa?", "o": ["Meningkatkan maruah bangsa dan negara", "Mengurangkan hubungan antara negara", "Mengehadkan penyertaan masyarakat dalam sukan", "Mengurangkan minat terhadap sukan"], "a": 0, "e": "Kejayaan atlet antarabangsa meningkatkan maruah bangsa dan negara di persada sukan."}, {"q": "Penganjuran kejohanan sukan antarabangsa boleh memberi kesan kepada ekonomi negara melalui", "o": ["kemasukan pelancong sukan", "pengurangan aktiviti perniagaan", "pengurangan penggunaan pengangkutan", "penurunan permintaan perkhidmatan"], "a": 0, "e": "Kejohanan antarabangsa menarik pelancong sukan yang menyumbang kepada aktiviti ekonomi."}, {"q": "Antara berikut, yang manakah kesan positif penglibatan sukan terhadap individu?", "o": ["Meningkatkan kesihatan dan membentuk perwatakan positif", "Meningkatkan hasil cukai pelancongan negara sahaja", "Meningkatkan jumlah hotel di kawasan kejohanan", "Mengukuhkan kerjasama teknologi antarabangsa"], "a": 0, "e": "Kesan terhadap individu merangkumi peningkatan kesihatan dan pembentukan perwatakan positif."}, {"q": "Pilih kesan penglibatan sukan yang paling tepat dari sudut ekonomi negara.", "o": ["Kemasukan pelancong sukan", "Semangat kekitaan dalam pasukan", "Pembentukan sahsiah individu", "Peningkatan kesedaran diri"], "a": 0, "e": "Kemasukan pelancong sukan merupakan kesan ekonomi negara."}, {"q": "Aktiviti sukan yang disertai bersama rakan dan masyarakat boleh membantu", "o": ["mengukuhkan hubungan dan integrasi antara kaum", "mengurangkan semangat kerjasama", "mengasingkan individu daripada komuniti", "menghapuskan peluang interaksi sosial"], "a": 0, "e": "Penyertaan dalam sukan menggalakkan interaksi dan integrasi antara kaum."}, {"q": "Antara berikut, yang manakah BUKAN kesan penglibatan sukan terhadap individu?", "o": ["Kemasukan pelancong asing", "Meningkatkan tahap kesihatan", "Membentuk perwatakan positif", "Meningkatkan kesedaran diri"], "a": 0, "e": "Kemasukan pelancong asing ialah kesan ekonomi negara, bukannya kesan langsung kepada individu."}, {"q": "Pernyataan yang manakah paling sesuai menerangkan kesan sukan terhadap negara?", "o": ["Meningkatkan maruah negara melalui kejayaan atlet", "Meningkatkan kesedaran diri seorang peserta", "Membentuk personaliti positif seorang pemain", "Mengurangkan tekanan seseorang atlet"], "a": 0, "e": "Kejayaan sukan di peringkat antarabangsa dapat meningkatkan maruah negara."}, {"q": "Antara berikut, pilih kesan penglibatan individu dalam sukan KECUALI", "o": ["Sumber kewangan daripada hak penajaan dan kedatangan pelancong meningkat", "Perwatakan positif dapat dibentuk", "Taraf kesihatan secara keseluruhan meningkat", "Semangat cintakan negara dapat dipupuk"], "a": 0, "e": "Penajaan dan kedatangan pelancong merupakan kesan ekonomi, bukan kesan penglibatan individu."}, {"q": "Apakah kesan sukan yang dapat dilihat apabila seseorang berasa bangga mewakili negara dalam pertandingan?", "o": ["Memupuk semangat patriotisme", "Meningkatkan kemasukan pelancong sukan", "Meningkatkan hasil perhotelan", "Menggalakkan perkongsian teknologi"], "a": 0, "e": "Mewakili negara dalam sukan boleh memupuk semangat cintakan negara atau patriotisme."}, {"q": "Penganjuran sukan antarabangsa memberi peluang kepada negara untuk", "o": ["menarik pelancong asing", "mengurangkan hubungan antarabangsa", "menghalang perkongsian teknologi", "mengehadkan aktiviti ekonomi"], "a": 0, "e": "Penganjuran kejohanan antarabangsa boleh menarik kedatangan pelancong asing."}, {"q": "Antara berikut, yang manakah kesan penglibatan sukan kepada masyarakat?", "o": ["Mengukuhkan integrasi nasional", "Meningkatkan kesedaran diri seorang atlet sahaja", "Membentuk perwatakan seorang pemain sahaja", "Meningkatkan pendapatan peribadi seorang jurulatih"], "a": 0, "e": "Sukan menjadi medium interaksi yang dapat mengukuhkan integrasi nasional."}, {"q": "Apakah maksud kesan penglibatan sukan terhadap individu dari aspek sahsiah?", "o": ["Pembentukan perwatakan dan nilai positif", "Peningkatan bilangan pelancong", "Pertambahan hasil cukai negara", "Perkongsian teknologi sukan antarabangsa"], "a": 0, "e": "Penglibatan sukan boleh membentuk perwatakan atau sahsiah yang positif."}, {"q": "Antara berikut, pilih padanan kesan yang betul.", "o": ["Individu – peningkatan kesihatan", "Negara – kesedaran diri", "Komuniti – hak penajaan atlet", "Ekonomi – semangat kekitaan"], "a": 0, "e": "Peningkatan kesihatan keseluruhan ialah antara kesan penglibatan sukan terhadap individu."}, {"q": "Pilih pernyataan yang benar tentang kesan penglibatan dalam sukan.", "o": ["Sukan boleh membentuk perwatakan positif", "Sukan sentiasa melemahkan integrasi kaum", "Sukan menghalang kemasukan pelancong", "Sukan tidak memberi kesan kepada kesihatan"], "a": 0, "e": "Sumber menyatakan pembentukan perwatakan positif sebagai salah satu kesan penglibatan sukan."}, {"q": "Kesan penganjuran sukan antarabangsa terhadap ekonomi negara termasuk", "o": ["peningkatan kedatangan pelancong sukan", "penurunan aktiviti perkhidmatan", "pengurangan peluang perniagaan", "pengurangan penggunaan kemudahan awam"], "a": 0, "e": "Kemasukan pelancong sukan memberi rangsangan kepada aktiviti ekonomi."}, {"q": "Antara berikut, yang manakah contoh kesan sukan kepada individu?", "o": ["Kesihatan keseluruhan meningkat", "Integrasi nasional semakin kukuh", "Pelancong asing bertambah", "Maruah negara meningkat di persada antarabangsa"], "a": 0, "e": "Kesihatan keseluruhan ialah kesan langsung pada peringkat individu."}, {"q": "Apakah kesan penglibatan sukan yang berkaitan dengan hubungan antara kaum?", "o": ["Mengukuhkan integrasi nasional", "Meningkatkan kecergasan individu sahaja", "Meningkatkan hasil penajaan sahaja", "Meningkatkan prestasi seorang atlet sahaja"], "a": 0, "e": "Sukan menggalakkan pergaulan dan integrasi dalam kalangan rakyat."}, {"q": "Pilih kombinasi kesan penglibatan sukan terhadap individu yang tepat.\nI. Meningkatkan tahap kesihatan\nII. Membentuk perwatakan positif\nIII. Menarik pelancong asing\nIV. Meningkatkan hasil perhotelan", "o": ["I dan II", "I dan III", "II dan IV", "III dan IV"], "a": 0, "e": "I dan II ialah kesan pada peringkat individu; III dan IV lebih berkaitan ekonomi negara."}, {"q": "Pilih kombinasi kesan sukan terhadap masyarakat yang tepat.\nI. Mengukuhkan integrasi nasional\nII. Meningkatkan maruah negara di peringkat antarabangsa\nIII. Menggalakkan hubungan antara kaum\nIV. Meningkatkan kesihatan seorang individu sahaja", "o": ["I dan III", "I dan II", "II dan IV", "III dan IV"], "a": 0, "e": "Integrasi nasional dan hubungan antara kaum ialah kesan pada peringkat masyarakat."}, {"q": "Pilih kombinasi yang menunjukkan kesan ekonomi penganjuran sukan antarabangsa.\nI. Kemasukan pelancong sukan\nII. Peningkatan aktiviti perkhidmatan kepada pelawat\nIII. Pembentukan sahsiah atlet\nIV. Kesedaran diri individu", "o": ["I dan II", "I dan III", "II dan IV", "III dan IV"], "a": 0, "e": "Kedatangan pelancong dan aktiviti perkhidmatan kepada pelawat berkaitan kesan ekonomi."}, {"q": "Pilih pernyataan yang benar tentang kesan penglibatan negara dalam bidang sukan.\nI. Penganjuran sukan antarabangsa menarik pelancong asing\nII. Kesihatan individu secara keseluruhan boleh meningkat\nIII. Perwatakan positif boleh dibentuk\nIV. Sukan boleh melaksanakan integrasi kaum", "o": ["I dan IV", "I dan II", "II dan III", "III dan IV"], "a": 0, "e": "I dan IV menggambarkan kesan kepada negara/masyarakat; II dan III lebih tertumpu kepada individu."}, {"q": "Seorang remaja menyertai aktiviti sukan secara konsisten dan menunjukkan perubahan sikap yang lebih berdisiplin. Kesan yang ditunjukkan ialah", "o": ["pembentukan sahsiah positif", "peningkatan pelancongan sukan", "perkongsian teknologi antarabangsa", "peningkatan hasil penajaan negara"], "a": 0, "e": "Perubahan sikap dan disiplin menggambarkan pembentukan sahsiah positif."}, {"q": "Kejohanan antarabangsa dianjurkan di sebuah bandar. Hotel, pengangkutan dan perkhidmatan makanan menerima lebih ramai pelanggan. Situasi ini menunjukkan", "o": ["kesan ekonomi penganjuran sukan", "kesan psikologi terhadap atlet", "kesan kesihatan terhadap individu", "kesan pembentukan sahsiah"], "a": 0, "e": "Kedatangan pengunjung meningkatkan permintaan terhadap perkhidmatan setempat."}, {"q": "Atlet yang berjaya mengharumkan nama negara di kejohanan dunia memberi kesan kepada", "o": ["maruah bangsa dan negara", "kesedaran diri komuniti sahaja", "kesihatan individu penonton sahaja", "jumlah peserta di sekolah sahaja"], "a": 0, "e": "Kejayaan antarabangsa meningkatkan maruah bangsa dan negara."}, {"q": "Antara berikut, yang manakah tidak tepat tentang kesan penglibatan dalam sukan?", "o": ["Sukan hanya memberi manfaat kepada atlet elit", "Sukan boleh meningkatkan kesihatan individu", "Sukan boleh membentuk perwatakan positif", "Sukan boleh mengukuhkan integrasi nasional"], "a": 0, "e": "Kesan sukan bukan terhad kepada atlet elit; masyarakat umum turut memperoleh manfaat."}, {"q": "Apakah kesan positif apabila pelbagai kaum menyertai aktiviti sukan bersama-sama?", "o": ["Hubungan dan integrasi nasional dapat diperkukuh", "Persaingan antara kaum pasti meningkat", "Interaksi sosial dapat dielakkan", "Semangat kerjasama akan berkurang"], "a": 0, "e": "Penyertaan bersama membina interaksi dan integrasi antara kaum."}, {"q": "Pilih padanan yang paling tepat bagi kesan penglibatan sukan.\nI. Individu – kesihatan meningkat\nII. Individu – pembentukan sahsiah\nIII. Ekonomi negara – kemasukan pelancong sukan\nIV. Masyarakat – integrasi nasional", "o": ["I, II, III dan IV", "I dan II sahaja", "II dan III sahaja", "I, III dan IV sahaja"], "a": 0, "e": "Keempat-empat padanan adalah tepat berdasarkan kesan sukan pada peringkat individu, masyarakat dan ekonomi negara."}];
let index=0, answers=Array(questions.length).fill(null), locked=false;
const quiz=document.getElementById('quiz'), result=document.getElementById('result');
function render(){
 const q=questions[index];locked=answers[index]!==null;
 document.getElementById('counter').textContent=`Soalan ${index+1} daripada ${questions.length}`;
 document.getElementById('progressText').textContent=`${Math.round(index/questions.length*100)}% selesai`;
 document.getElementById('progress').style.width=`${index/questions.length*100}%`;
 quiz.innerHTML=`<section class="question"><div class="small">SOALAN ${index+1}</div><h2>${q.q.replace(/\n/g,'<br>')}</h2><div id="opts">${q.o.map((v,i)=>`<label class="option" id="opt${i}"><input type="radio" name="answer" value="${i}" ${locked&&answers[index]===i?'checked':''} ${locked?'disabled':''}><b>${'ABCD'[i]}.</b> ${v}</label>`).join('')}</div><div id="feedback" class="feedback"></div><div><button id="check" ${locked?'disabled':''} onclick="checkAnswer()">Semak jawapan</button><button class="secondary" id="next" ${locked?'':'disabled'} onclick="nextQuestion()">${index===questions.length-1?'Lihat keputusan':'Soalan seterusnya'}</button></div></section>`;
 if(locked) showFeedback();
}
function checkAnswer(){
 const selected=document.querySelector('input[name="answer"]:checked');
 if(!selected){alert('Sila pilih satu jawapan.');return;}
 answers[index]=Number(selected.value);locked=true;
 document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
 document.getElementById('check').disabled=true;document.getElementById('next').disabled=false;showFeedback();
}
function showFeedback(){
 const q=questions[index],a=answers[index];
 q.o.forEach((_,i)=>{const el=document.getElementById('opt'+i);if(i===q.a)el.classList.add('correct');if(i===a&&a!==q.a)el.classList.add('wrong')});
 const f=document.getElementById('feedback');f.className='feedback show '+(a===q.a?'good':'bad');
 f.innerHTML=`<b>${a===q.a?'Betul!':'Belum tepat.'}</b><br>Jawapan: <b>${'ABCD'[q.a]}. ${q.o[q.a]}</b><br>${q.e}`;
}
function nextQuestion(){if(index<questions.length-1){index++;render();window.scrollTo(0,0)}else showResult()}
function showResult(){
 const score=answers.filter((a,i)=>a===questions[i].a).length,pct=Math.round(score/questions.length*100);
 const grade=pct>=80?'Cemerlang':pct>=50?'Sederhana':'Perlu Usaha Lagi';
 quiz.classList.add('hidden');result.classList.remove('hidden');
 document.getElementById('progress').style.width='100%';document.getElementById('progressText').textContent='100% selesai';
 result.innerHTML=`<h2>Keputusan Kuiz</h2><div class="score">${score}/${questions.length}</div><p><b>${pct}% — ${grade}</b></p><p>${grade==='Cemerlang'?'Tahniah! Penguasaan anda sangat baik.':grade==='Sederhana'?'Baik. Teruskan ulang kaji untuk meningkatkan penguasaan.':'Teruskan usaha dan ulang kaji semula topik ini.'}</p><button onclick="review()">Semak jawapan</button><button class="secondary" onclick="restart()">Cuba semula</button><div id="review" class="hidden"></div>`;
}
function review(){
 const box=document.getElementById('review');box.classList.toggle('hidden');
 box.innerHTML='<h2>Semakan Jawapan</h2>'+questions.map((q,i)=>`<div class="review-item"><b>${i+1}. ${q.q.replace(/\n/g,' ')}</b><br>Jawapan anda: ${answers[i]===null?'Tiada jawapan':'ABCD'[answers[i]]}<br>Jawapan betul: <b>${'ABCD'[q.a]}. ${q.o[q.a]}</b><br><span class="small">${q.e}</span></div>`).join('');
}
function restart(){index=0;answers=Array(questions.length).fill(null);quiz.classList.remove('hidden');result.classList.add('hidden');render();window.scrollTo(0,0)}
render();
</script></body></html>
